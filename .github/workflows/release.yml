name: Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  # Tags/dispatch publish a release; branch pushes only upload artifacts.
  TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('dev-{0}', github.run_number) }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      # Native MSVC build: gpui's build script precompiles the HLSL shaders
      # with fxc.exe from the Windows SDK on the runner.
      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p davi-ui

      - name: Package
        shell: pwsh
        run: |
          $dir = "davi-$env:TAG-windows-x64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/davi.exe $dir/
          Copy-Item README.md $dir/
          Copy-Item -Recurse examples/sample-collection $dir/sample-collection
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          Copy-Item target/x86_64-pc-windows-msvc/release/davi.exe "davi-$env:TAG-windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: davi-windows-x64
          path: |
            davi-*-windows-x64.zip
            davi-*-windows-x64.exe

  linux:
    # The oldest supported runner, so the binary links against an old glibc
    # (2.35) and runs on more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig-dev libfreetype-dev libvulkan-dev libxcb1-dev \
            libx11-xcb-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build
        run: cargo build --release --locked -p davi-ui

      # tar.gz (with install.sh), .deb and AppImage into dist/.
      - name: Package
        run: packaging/linux/package.sh "$TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: davi-linux-x64
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Davi ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
