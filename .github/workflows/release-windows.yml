name: Release (Windows)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Tags/dispatch publish a release; branch pushes only upload an artifact.
      TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('dev-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      # Native MSVC build: gpui's build script precompiles the HLSL shaders
      # with fxc.exe from the Windows SDK on the runner.
      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p davi-ui

      - name: Package
        shell: pwsh
        run: |
          $dir = "davi-$env:TAG-windows-x64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/davi.exe $dir/
          Copy-Item README.md $dir/
          Copy-Item -Recurse examples/sample-collection $dir/sample-collection
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          Copy-Item target/x86_64-pc-windows-msvc/release/davi.exe "davi-$env:TAG-windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: davi-windows-x64
          path: |
            davi-*-windows-x64.zip
            davi-*-windows-x64.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Davi ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            davi-*-windows-x64.zip
            davi-*-windows-x64.exe
